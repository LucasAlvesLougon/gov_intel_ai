[project]
name = "govintel-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.17,<4",
  "djangorestframework-simplejwt>=5.5,<6",
  "celery[redis]>=5.6,<5.7",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<26",
  "pypdf>=6.16.1,<7",
  "pgvector>=0.3.0",
  "google-genai>=0.1.0",
  "langchain>=1.3.9,<2",
  "langchain-openai>=1,<3",
  "openai>=1.90,<3",
  "sentence-transformers>=5,<6",
  "torch>=2.0",
  "django-cors-headers>=4.7,<5",
  "pypdfium2>=4,<11",
  "pytesseract>=0.3.10,<0.4",
  "pillow>=12.3,<13",
]

[dependency-groups]
dev = [
  "pip-audit>=2.9,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=6,<7",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
